<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx-get="http://www.w3.org/1999/xhtml"
      xmlns:hx-on="http://www.w3.org/1999/xhtml">
<div th:fragment="airport-form(iterIndex,longitude,latitude)">
    <datalist id="filtered-list-" th:attrappend="id=${iterIndex}"></datalist>
    <div class="input-group mb-4">
        <select class="form-select"
                name="airportFilter"
                style="max-width:150px"
                hx-get="/nearby-airports"
                th:hx-vals="'{&quot;latitude&quot;:'+${latitude}+',&quot;longitude&quot;:'+${longitude}+'}'"
                th:hx-on::after-request="'setAirportPlaceHolderFromList(\'airport-code-' + ${iterIndex} + '\',\'filtered-list-' + ${iterIndex} + '\')'"
                th:hx-on::before-request="'clearAirportMarkerFitToElemId(airportMarker,\'location-display-'+${iterIndex}+'\')'"
                th:hx-target="'#filtered-list-'+${iterIndex}"
                hx-trigger="load,change"
                hx-swap="innerHTML">
            <option selected value="DELTA">Delta Airports</option>
            <hr class="dropdown-divider">
            <option disabled>Additional Airline Support Under Development</option>
        </select>
        <input th:id="'airport-code-'+${iterIndex}"
               class="form-control"
               type="text" aria-label="Airport"
               oninput="checkAirportInput(this)"
               name="airport-code"
               th:list="'filtered-list-'+${iterIndex}" required>
    </div>
</div>
<div th:fragment="non-delta-airport-form(iterIndex,longitude,latitude)"
     th:id="'non-delta-airport-form-'+${iterIndex}"
     hx-get="/closer-airports"
     th:hx-vals="'{&quot;latitude&quot;:'+${latitude}+',&quot;longitude&quot;:'+${longitude}+',&quot;iterIndex&quot;:'+${iterIndex}+'}'"
     th:hx-target="'#non-delta-airport-form-'+${iterIndex}"
     hx-trigger="load"
     hx-swap="outerHTML transition:true"
>
</div>
<div th:fragment="saved-locations"
     id="savedLocations"
     class="accordion list-group">
    <div th:if="${locations != null && locations.size > 0}" class="accordion item" th:each="locationDisplay,iter : ${locations}">
        <button th:if="${iter.first}"
                id="location-display-0"
                class="accordion-button list-group-item list-group-item-action list-group-item-light"
                type="button"
                aria-controls="collapse-location-0"
                data-bs-toggle="collapse"
                data-bs-target="#collapse-location-0"
                th:data-lat="${locationDisplay.latitude}"
                th:data-lng="${locationDisplay.longitude}"
                th:data-bounds-west="${locationDisplay.bbox[0]}"
                th:data-bounds-south="${locationDisplay.bbox[1]}"
                th:data-bounds-east="${locationDisplay.bbox[2]}"
                th:data-bounds-north="${locationDisplay.bbox[3]}"
                aria-expanded="true"
                th:text="${locationDisplay.name} + ', ' + ${locationDisplay.subdivision} + ' | ' + ${locationDisplay.countryCode}"
                th:onclick="zoomToLocationMap(0,[[${locationDisplay.longitude}]],[[${locationDisplay.latitude}]],[[${locationDisplay.bbox}]])"></button>
        <button th:unless="${iter.first}"
                id="location-display-"
                class="accordion-button list-group-item list-group-item-action list-group-item-light collapsed"
                type="button"
                aria-controls="collapse-location-"
                data-bs-toggle="collapse"
                data-bs-target="#collapse-location-"
                aria-expanded="false"
                th:text="${locationDisplay.name} + ', ' + ${locationDisplay.subdivision} + ' | ' + ${locationDisplay.countryCode}"
                th:onclick="zoomToLocationMap([[${iter.index}]],[[${locationDisplay.longitude}]],[[${locationDisplay.latitude}]],[[${locationDisplay.bbox}]])"
                th:attrappend="data-bs-target=${iter.index},aria-controls=${iter.index},id=${iter.index}"></button>
        <div
                id="collapse-location-"
                class="accordion-collapse collapse"
                data-bs-parent="#savedLocations"
                th:attrappend="id=${iter.index}"
                th:classappend="${iter.first}? show">
            <div class="accordion-body">
                <p th:text="${locationDisplay.name} +' is a locality of '
                + ${locationDisplay.subdivision} + ' in '
                + ${locationDisplay.countryCode} + '.'">
                </p>
                <div id="airports-container-"
                     class="container mb-2"
                     th:attrappend="id=${iter.index}">
                    <div th:replace="~{fragments/locations :: airport-form(iterIndex=${iter.index},longitude=${locationDisplay.longitude},latitude=${locationDisplay.latitude})}"></div>
                    <div th:replace="~{fragments/locations :: non-delta-airport-form(iterIndex=${iter.index},longitude=${locationDisplay.longitude},latitude=${locationDisplay.latitude})}"></div>
                    <form th:replace="~{fragments/form :: remove-location-display}"></form>
                </div>
            </div>
        </div>
    </div>
    <div th:unless="${locations != null && locations.size > 0}"
         class="list-group-item list-group-item-secondary">No saved trips. Click 'Add Location' to plan new trip.</div>
</div>
<input th:fragment="airport-details-input"
       th:if="${airportDisplay}"
       th:id="${elemId}"
       th:value="${airportDisplay.iata}"
       th:data-latitude="${airportDisplay.latitude}"
       th:data-longitude="${airportDisplay.longitude}"
       th:data-countryCode="${airportDisplay.countryCode}"
       th:data-city="${airportDisplay.city}"
       th:data-subdivision="${airportDisplay.subdivision}"
       th:data-distance="${airportDisplay.subdivision}"
>
<option th:fragment="saved-locations-options"
        th:each="locationDisplay,iter : ${locations}"
        th:text="${locationDisplay.name} + ', ' + ${locationDisplay.subdivision} + ' | ' + ${locationDisplay.countryCode}"
        th:value="${locationDisplay.id}"
        th:disabled="${selectedId != null && selectedId == locationDisplay.id}? true : false"
        th:id="${isStart}?'start-location-'+${locationDisplay.id}:'end-location-'+${locationDisplay.id}"
        th:data-longitude="${locationDisplay.longitude}"
        th:data-latitude="${locationDisplay.latitude}"
        th:data-city="${locationDisplay.name}"
        th:data-subdivision="${locationDisplay.subdivision}"
        th:data-country="${locationDisplay.countryCode}"
        th:data-bounds-west="${locationDisplay.bbox[0]}"
        th:data-bounds-south="${locationDisplay.bbox[1]}"
        th:data-bounds-east="${locationDisplay.bbox[2]}"
        th:data-bounds-north="${locationDisplay.bbox[3]}"
></option>
</html>
