<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:hx-on="http://www.w3.org/1999/xhtml">

<!--SAVED NAV BAR WITH AUTOSCROLL-->
<div th:fragment="saved-scroll-nav(countryList)"
     id="trips-scroll-nav"
     class="d-flex flex-column simple-list-example-scrollspy">
  <a th:each="country,countryIter : ${countryList}"
     class="p-1 rounded"
     th:href="'#country-locations-' + ${country.code}"
     th:data-country-bounds="${#strings.arrayJoin(
        #numbers.arrayFormatDecimal(country.bounds, 1, 'POINT', 5, 'POINT'),',')}"
     onclick="mapToCountry(this)">
    <span th:text="${country.name}"></span>
  </a>
</div>

<!--SAVED ACCORDION Continents-->
<div th:fragment="saved-continent-list(continentList,continentCountryList)" class="accordion list-group"
     id="continent-list">
  <div th:each="continent,iter : ${continentList}"
          class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button list-group-item" type="button"
              data-bs-toggle="collapse"
              th:href="'#continent-locations-'+${continent.name}"
              onclick="scrollElemToHref(this)"
              th:data-bs-target="'#continent-display-'+${continent.name}"
              th:text="${#lists.isEmpty(continentCountryList[iter.index])}?${continent.displayText}+' (none saved)':${continent.displayText}"
              th:disabled="${#lists.isEmpty(continentCountryList[iter.index])}"
              aria-controls="collapseOne"></button>
    </h2>
    <div th:id="'continent-display-'+${continent.name}"
         class="accordion-collapse collapse"
         th:classappend="${iter.first}?'show':''"
         data-bs-parent="#continent-list">
      <div class="accordion-body">
        <nav th:replace="~{fragments/saved :: saved-scroll-nav(countryList=${continentCountryList[iter.index]})}"></nav>
      </div>
    </div>
  </div>
</div>

<!--MAIN SAVED PAGE-->
<div th:fragment="main-saved-page" class="row">
  <div class="col-4">
    <div th:replace="~{fragments/saved :: saved-continent-list(continentList=${continentList},continentCountryList=${continentCountryList})}"></div>
  </div>
  <div class="col-8">
    <div id="scrollable-content"
         data-bs-spy="scroll"
         data-bs-target="#navbar-example3"
         data-bs-smooth-scroll="true"
         class="scrollspy-example-2 overflow-y-scroll"
         style="height:350px;"
         tabindex="0">
      <div th:each="continent,iter : ${continentList}"
           th:id="'continent-locations-'+${continent.name}">
        <div th:each="country,countryIter : ${continentCountryList[iter.index]}"
             class="card"
             th:id="'country-locations-'+${country.code}">
          <div class="card-body">
            <h3 class="card-title" th:text="${country.name}"></h3>
            <div th:with="billions=${country.population/1000000000.0},millions=${country.population/1000000.0}">Population:
              <span th:if="${billions.intValue() > 0}" th:text="${#numbers.formatDecimal(billions,1,2,'POINT') + 'B'}"></span>
              <span th:if="${billions.intValue() == 0 and millions.intValue() > 0}" th:text="${#numbers.formatDecimal(millions,1,2,'POINT') + 'M'}"></span>
              <span th:if="${billions.intValue() == 0 and millions.intValue() == 0}" th:text="${#numbers.formatInteger(country.population,1,'COMMA')}"></span>
            </div>
            <div>Area(km^2): <span th:text="${#numbers.formatInteger(country.areaInSqKm,0,'COMMA')}"></span></div>
            <div>Currency: <span th:text="${country.currencyCode}"></span></div>
            <div>Capital: <span th:text="${country.capitalCity}"></span></div>
            <div>Languages: <span th:text="${#strings.listJoin(country.languages, ', ')}"></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!--LIST OF SAVED LOCATIONS loaded on SAVED TAB-->
<div th:fragment="saved-locations"
     id="savedLocations"
     class="accordion list-group">
  <form class="form-check form-switch mb-4 mt-2"
        th:object="${locationFilter}">
    <input hx-get="/saved-locations"
           hx-target="#saved-locations-container"
           hx-swap="outerHTML transition:true"
           hx-trigger="change"
           hx-include="[name='filterArchive']"
           hx-on::after-request="switchEngage(this)"
           class="form-check-input"
           type="checkbox"
           role="switch"
           id="filterArchive"
           name="filterArchive"
           th:field="*{filterArchive}"
           th:checked="${locationFilter.filterArchive}"
    >
    <label class="form-check-label" for="filterArchive">Include Archived</label>
  </form>
  <div id="saved-locations-container">
    <div th:unless="${locationDetailsList.size > 0}"
         class="list-group-item list-group-item-secondary">No saved locations. 'Browse' to add locations.</div>
    <div th:each="locationDetail,iter : ${locationDetailsList}"
         class="accordion item">
      <button id="location-display-"
              class="accordion-button list-group-item list-group-item-action list-group-item-light collapsed"
              type="button"
              aria-controls="collapse-location-"
              data-bs-toggle="collapse"
              data-bs-target="#collapse-location-"
              aria-expanded="false"
              th:text="${locationDetail.location.name} + ', ' + ${locationDetail.location.subdivision} + ' | ' + ${locationDetail.location.countryCode}"
              th:onclick="zoomToLocationMap([[${locationDetail.location.name}]],[[${locationDetail.location.id}]],this)"
              th:attrappend="data-bs-target=${iter.index},aria-controls=${iter.index},id=${iter.index}"></button>
      <div
              id="collapse-location-"
              class="accordion-collapse collapse"
              data-bs-parent="#savedLocations"
              th:attrappend="id=${iter.index}">
        <div class="accordion-body">
          <p th:text="${locationDetail.location.name} +' is a locality of '
                + ${locationDetail.location.subdivision} + ' in '
                + ${locationDetail.location.countryCode} + '.'">
          </p>
          <div id="airports-container-"
               class="container mb-2"
               th:attrappend="id=${iter.index}">
            <div th:replace="~{fragments/pinned :: pin-airport-form-initial(locationDetail=${locationDetail})}"></div>
            <form th:replace="~{fragments/form :: archive-location-display}"></form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</html>
