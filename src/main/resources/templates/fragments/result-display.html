<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns="http://www.w3.org/1999/html">
<datalist th:fragment="iata-code-list"
          id="filtered-list-"
          th:attrappend="id=${iterIndex}">
    <option th:each="airportDisplay,iter : ${nearbyAirports}"
            th:id="'result-'+${iterIndex}+'-airport-'+${iter.index}"
            th:name="${airportDisplay.iata}"
            th:value="${airportDisplay.iata}"
            th:data-longitude="${airportDisplay.longitude}"
            th:data-latitude="${airportDisplay.latitude}"
            th:text="${airportDisplay.name}"></option>
</datalist>
</html>
