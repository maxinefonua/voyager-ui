<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Trip Content</title>
</head>
<div th:fragment="trips" class="container">
    <div class="row justify-content-center">
        <div class="col-1 d-flex justify-content-center">
          <div th:replace="~{fragments/trips :: trips-scroll-nav}"></div>
        </div>
        <div class="col-11">
            <div id="scrollable-content"
                    data-bs-spy="scroll"
                    data-bs-target="#trips-scroll-nav"
                    data-bs-smooth-scroll="true"
                    class="scrollspy-example overflow-y-scroll"
                    style="height:250px;"
                    tabindex="0">
                <h4 id="from-city">From</h4>
                <div style="height:250px"
                     class="overflow-auto p-2">
                    <span id="from-location-container"
                          hx-swap="beforeend transition:true"
                          hx-get="/lookup"
                          hx-trigger="load"
                          hx-target="#select-start-location"
                          hx-vals='"isStart":"true"'
                          class="overflow-auto">
                    <select class="form-select"
                            id="select-start-location"
                            name="startLocationId"
                            hx-swap="innerHTML transition:true"
                            hx-get="/review-location-reset"
                            hx-trigger="change"
                            hx-target="#review-summary"
                            hx-include="#select-end-location,#airport-end-code,#non-delta-end-code"
                            hx-vals='"fromOrigin":"true"'
                            hx-on::after-request="addTripLocationToMap(this.options[this.selectedIndex],true)"
                    >
                        <option selected disabled value="0">Start Location</option>
                    </select>
                    <datalist id="filtered-airports-start"></datalist>
                    <div th:replace="~{fragments/form :: airport-form-initial(true)}"></div>
                </span>
                    <div id="non-delta-start"
                         hx-swap-oob="outerHTML:#non-delta-start">
                    </div>
                </div>
                <h4 id="to-city">To</h4>
                <div id="to-location-container"
                     hx-get="/lookup"
                     hx-vals='"isStart":"false"'
                     hx-swap="beforeend transition:true"
                     hx-target="#select-end-location"
                     hx-trigger="load"
                     style="height:250px"
                     class="overflow-auto p-2">
                    <select class="form-select"
                            id="select-end-location"
                            name="endLocationId"
                            hx-swap="innerHTML transition:true"
                            hx-get="/review-location-reset"
                            hx-trigger="change"
                            hx-target="#review-summary"
                            hx-include="#select-start-location,#airport-start-code,#non-delta-start-code"
                            hx-vals='"fromOrigin":"false"'
                            hx-on::after-request="addTripLocationToMap(this.options[this.selectedIndex],false)"
                    >
                        <option selected disabled value="0">End Location</option>
                    </select>
                    <datalist id="filtered-airports-end"></datalist>
                    <div th:replace="~{fragments/form :: airport-form-initial(false)}"></div>
                    <div id="non-delta-end"
                         hx-swap-oob="outerHTML:#non-delta-end">
                    </div>
                </div>
                <h4 id="review">Review</h4>
                <div id="review-summary"
                     style="height:200px"
                     class="overflow-auto p-2">
                    <div th:replace="~{fragments/trips :: review-path}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:fragment="trips-scroll-nav"
     id="trips-scroll-nav" style="width:40px" class="list-group">
    <a class="list-group-item list-group-item-action" href="#from-city" onclick="zoomToTripLocation(true)">u</a>
    <a class="list-group-item list-group-item-action" href="#to-city" onclick="zoomToTripLocation(false)">d</a>
    <a class="list-group-item list-group-item-action" href="#review" onclick="mapFitToTrip()">c</a>
</div>
<div th:fragment="review-path" class="container text-center">
    <div class="row justify-content-center">
        <div class="col-5">
            <figure>
                <blockquote class="blockquote">
                    <span th:if="${startLocation}"
                       th:text="${startLocation.name} + ', ' + ${startLocation.subdivision}"></span>
                    <span th:if="${startLocation == null && nonDeltaStartAirport != null}"
                          th:text="${nonDeltaStartAirport.city} + ', ' + ${nonDeltaStartAirport.subdivision}"></span>
                    <span th:if="${startLocation == null && nonDeltaStartAirport == null && startAirport != null}"
                          th:text="${startAirport.city} + ', ' + ${startAirport.subdivision}"></span>
                    <i th:if="${startLocation == null && startAirport == null && nonDeltaStartAirport == null}">Select Start Location</i>
                </blockquote>
                <figcaption class="blockquote-footer">
                   <div th:if="${nonDeltaStartAirport}">
                        Initial Check-In: <strong th:text="${nonDeltaStartAirport.iata}"></strong>
                   </div>
                    <span th:text="${nonDeltaStartAirport}?'Delta Check-In: ':'Check-In: '"></span>
                    <strong th:if="${startAirport}" th:text="${startAirport.iata}"></strong>
                    <i th:unless="${startAirport}">Select Start Airport</i>
                </figcaption>
            </figure>
        </div>
        <button class="vr btn-reverse container"
                th:disabled="${startAirport == null and endAirport == null and endLocation == null and startLocation == null and nonDeltaStartAirport == null and nonDeltaEndAirport == null}"></button>
        <div class="col-5">
            <figure>
                <blockquote class="blockquote">
                    <span th:if="${endLocation}"
                          th:text="${endLocation.name} + ', ' + ${endLocation.subdivision}"></span>
                    <span th:if="${endLocation == null && nonDeltaEndAirport != null}"
                          th:text="${nonDeltaEndAirport.city} + ', ' + ${nonDeltaEndAirport.subdivision}"></span>
                    <span th:if="${endLocation == null && nonDeltaEndAirport == null && endAirport != null}"
                          th:text="${endAirport.city} + ', ' + ${endAirport.subdivision}"></span>
                    <i th:if="${endLocation == null && endAirport == null && nonDeltaEndAirport == null}">Select End Location</i>
                </blockquote>
                <figcaption class="blockquote-footer">
                    <span th:text="${nonDeltaEndAirport}?'Delta Destination: ':'Destination: '"></span>
                    <strong th:if="${endAirport}" th:text="${endAirport.iata}"></strong>
                    <i th:unless="${endAirport}">Select End Airport</i>
                    <div th:if="${nonDeltaEndAirport}">
                        Final Destination: <strong th:text="${nonDeltaEndAirport.iata}"></strong>
                    </div>
                </figcaption>
            </figure>
        </div>
    </div>
    <div th:if="${startAirport != null or endAirport != null}" class="row justify-content-center">
        <div class="col-5">
            <h5>Delta Route</h5>
            <div class="m-2">
                <span th:text="${startAirport}?${startAirport.iata}:'?'"></span>
                <span th:if="${middleAirports}" th:each="iata,iter : ${middleAirports}" th:text="' -> ' + ${iata}"></span>
                <span th:text="${endAirport}?' -> ' + ${endAirport.iata}:' -> ?'"></span>
            </div>
        </div>
        <button class="vr btn-primary container" disabled></button>
        <div class="col-5">
            <h5 th:if="${middleAirports}">Allowed Airports</h5>
            <div th:if="${middleAirports}"
                 class="hstack gap-5 form-check m-2 justify-content-center">
                <div>
                    <input class="form-check-input" type="checkbox" value="" id="start-checked" checked disabled>
                    <label class="form-check-label" for="checkChecked" th:text="${startAirport.iata}"></label>
                </div>
                <div th:each="iata,iter : ${middleAirports}">
                    <input class="form-check-input" type="checkbox" th:value="${iata}" checked>
                    <label class="form-check-label" for="checkChecked" th:text="${iata}"></label>
                </div>
                <div>
                    <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked disabled>
                    <label class="form-check-label" for="checkChecked" th:text="${endAirport.iata}"></label>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
