<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Trip Content</title>
</head>
<div th:fragment="trips" class="container">
    <div class="row justify-content-center">
        <div class="col-2 d-flex justify-content-center">
          <div th:replace="~{fragments/trips :: trips-scroll-nav}"></div>
        </div>
        <div class="col-8">
            <div id="scrollable-content"
                    data-bs-spy="scroll"
                    data-bs-target="#trips-scroll-nav"
                    data-bs-smooth-scroll="true"
                    class="scrollspy-example overflow-y-scroll"
                    style="height:250px;"
                    tabind.  ex="0">
                <h4 id="from-city">From</h4>
                <div id="from-location-container"
                     style="height:250px"
                     hx-swap="beforeend transition:true"
                     hx-get="/lookup"
                     hx-trigger="load"
                     hx-target="#select-start-location"
                     hx-vals='"isStart":"true"'
                     class="overflow-auto p-2">
                    <select class="form-select"
                            id="select-start-location"
                            name="startLocationId"
                            hx-swap="innerHTML transition:true"
                            hx-get="/review-location-reset"
                            hx-trigger="change"
                            hx-target="#review-summary"
                            hx-include="#select-end-location,#airport-end-code"
                            hx-vals='"fromOrigin":"true"'
                            hx-on::after-request="addTripLocationToMap(this.options[this.selectedIndex],true)"
                    >
                        <option selected disabled value="0">Start Location</option>
                    </select>
                    <div th:replace="~{fragments/form :: airport-form-initial(true)}"></div>
                </div>
                <h4 id="to-city">To</h4>
                <div id="to-location-container"
                     hx-get="/lookup"
                     hx-vals='"isStart":"false"'
                     hx-swap="beforeend transition:true"
                     hx-target="#select-end-location"
                     hx-trigger="load"
                     style="height:250px"
                     class="overflow-auto p-2">
                    <select class="form-select"
                            id="select-end-location"
                            name="endLocationId"
                            hx-swap="innerHTML transition:true"
                            hx-get="/review-location-reset"
                            hx-trigger="change"
                            hx-target="#review-summary"
                            hx-include="#select-start-location,#airport-start-code"
                            hx-vals='"fromOrigin":"false"'
                            hx-on::after-request="addTripLocationToMap(this.options[this.selectedIndex],false)"
                    >
                        <option selected disabled value="0">End Location</option>
                    </select>
                    <div th:replace="~{fragments/form :: airport-form-initial(false)}"></div>
                </div>
                <h4 id="review">Review</h4>
                <div id="from-result-container"
                     style="height:250px"
                     class="overflow-auto p-2">
                    <div id="review-summary">
                        <div>TBD - Select From/To locations and airports to enable review</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:fragment="trips-scroll-nav"
     id="trips-scroll-nav" style="width:90px" class="list-group">
    <a class="list-group-item list-group-item-action" href="#from-city" onclick="zoomToTripLocation(true)">From</a>
    <a class="list-group-item list-group-item-action" href="#to-city" onclick="zoomToTripLocation(false)">To</a>
    <a class="list-group-item list-group-item-action" href="#review" onclick="mapFitToTrip()">Review</a>
</div>
<div th:fragment="review-path">
    <div th:text="'From: '+${start} + ' -> ' + ${end}"></div>
    <div th:text="'Airport: '+${origin} + ' -> ' + ${destination}"></div>
    <div th:if="${pathDisplay}">
        <div th:each="routeDisplay,iter : ${pathDisplay.routeDisplayList}"
             th:text="${routeDisplay.origin} + ' -> ' + ${routeDisplay.destination}">
        </div>
    </div>
</div>
</html>
