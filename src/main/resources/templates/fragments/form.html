<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns="http://www.w3.org/1999/html"
      xmlns:hx-on="http://www.w3.org/1999/xhtml">
<div th:fragment="airport-start-form">
    <div class="input-group mb-4">
        <datalist id="filtered-airports-start"></datalist>
        <select class="input-group-text"
                name="airportFilter"
                th:hx-get="@{/nearby-airports?latitude={latitude}&longitude={longitude}(latitude=${locationDisplay.latitude},longitude=${locationDisplay.longitude})}"
                hx-target="@{#filtered-airports-start}"
                hx-trigger="change,load"
                hx-on::after-request="setAirportPlaceHolder()"
                hx-swap="outerHTML">
            <option selected value="DELTA">Delta Airports</option>
            <hr class="dropdown-divider">
            <option value="CIVIL">Civil</option>
            <option value="MILITARY">Military</option>
            <option value="ALL">All</option>
        </select>
        <input id="airport-code"
               class="form-control"
               type="text" aria-label="Airport"
               oninput="checkAirportInput(this)"
               name="airport-code"
               list="filtered-airports-start" required>
    </div>
</div>

<form th:fragment="add-location-form"
      id="input-group-"
      th:attrappend="id=${iter.index}"
      th:object="${locationForm}">
    <div th:if="${resultSearch.status.name() == 'NEW'}">
        <input type="hidden" id="source" name="source" th:value="${resultSearch.source}" />
        <input type="hidden" id="sourceId" name="sourceId" th:value="${resultSearch.sourceId}" />
        <input type="hidden" id="name" name="name" th:value="${resultSearch.name}" />
        <input type="hidden" id="subdivision" name="subdivision" th:value="${resultSearch.subdivision}" />
        <input type="hidden" id="countryCode" name="countryCode" th:value="${resultSearch.countryCode}" />
        <input type="hidden" id="latitude" name="latitude" th:value="${resultSearch.latitude}" />
        <input type="hidden" id="longitude" name="longitude" th:value="${resultSearch.longitude}" />
        <input type="hidden" id="west" name="west" th:value="${resultSearch.bounds[0]}" />
        <input type="hidden" id="south" name="south" th:value="${resultSearch.bounds[1]}" />
        <input type="hidden" id="east" name="east" th:value="${resultSearch.bounds[2]}" />
        <input type="hidden" id="north" name="north" th:value="${resultSearch.bounds[3]}" />
    </div>
    <div class="d-grid gap-2">
        <button th:disabled="${resultSearch.status.name() == 'NEW'}?false:true"
                class="btn btn-primary"
                hx-post="/locations"
                hx-swap="outerHTML transition:true"
                type="submit" th:text="${resultSearch.status.display}"></button>
    </div>
</form>

<form th:fragment="add-start-form"
      id="input-group-"
      th:attrappend="id=${iter.index}"
      th:object="${locationForm}">
    <div th:if="${resultSearch.status.name() == 'NEW'}">
        <input type="hidden" id="source" name="source" th:value="${resultSearch.source}" />
        <input type="hidden" id="sourceId" name="sourceId" th:value="${resultSearch.sourceId}" />
        <input type="hidden" id="name" name="name" th:value="${resultSearch.name}" />
        <input type="hidden" id="subdivision" name="subdivision" th:value="${resultSearch.subdivision}" />
        <input type="hidden" id="countryCode" name="countryCode" th:value="${resultSearch.countryCode}" />
        <input type="hidden" id="latitude" name="latitude" th:value="${resultSearch.latitude}" />
        <input type="hidden" id="longitude" name="longitude" th:value="${resultSearch.longitude}" />
        <input type="hidden" id="west" name="west" th:value="${resultSearch.bounds[0]}" />
        <input type="hidden" id="south" name="south" th:value="${resultSearch.bounds[1]}" />
        <input type="hidden" id="east" name="east" th:value="${resultSearch.bounds[2]}" />
        <input type="hidden" id="north" name="north" th:value="${resultSearch.bounds[3]}" />
    </div>
    <div class="d-grid gap-2">
        <button th:if="${resultSearch.status.name() == 'NEW'}"
                class="btn btn-primary"
                hx-post="/locations"
                hx-swap="outerHTML transition:true"
                type="submit"
                th:text="${resultSearch.status.display}"></button>
        <button th:unless="${resultSearch.status.name() == 'NEW'}"
                class="btn btn-outline-primary"
                th:text="${resultSearch.status.display}"
                disabled></button>
    </div>
</form>

<div>

</div>
<button th:fragment="add-form-success"
        class="btn btn-primary" disabled>Added
</button>
<button th:fragment="add-form-error"
        class="btn btn-danger" disabled>Error
</button>
