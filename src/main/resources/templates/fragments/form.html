<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns="http://www.w3.org/1999/html">
<form th:fragment="add-location-form"
      hx-post="/locations" th:object="${locationForm}"
      class="input-group" th:id="'input-group-'+${iter.index}">
    <input type="hidden" id="name" name="name" th:value="${resultSearch.name}" />
    <input type="hidden" id="subdivision" name="subdivision" th:value="${resultSearch.subdivision}" />
    <input type="hidden" id="countryCode" name="countryCode" th:value="${resultSearch.countryCode}" />
    <input type="hidden" id="latitude" name="latitude" th:value="${resultSearch.latitude}" />
    <input type="hidden" id="longitude" name="longitude" th:value="${resultSearch.longitude}" />
    <select class="form-select input-group-text text-start"
            name="airportFilter"
            th:hx-get="@{/nearby-airports?iterIndex={index}&latitude={latitude}&longitude={longitude}(index=${iter.index},latitude=${resultSearch.latitude},longitude=${resultSearch.longitude})}"
            th:hx-target="@{#filtered-list-{index}(index=${iter.index})}"
            hx-trigger="change"
            hx-swap="outerHTML">
        <option selected value="DELTA">Delta Airports</option>
        <hr class="dropdown-divider">
        <option value="CIVIL">Civil</option>
        <option value="MILITARY">Military</option>
        <option value="ALL">All</option>
    </select>
    <datalist id="filtered-list-" th:attrappend="id=${iter.index}"
              hx-trigger="load"
              hx-swap="outerHTML"
              th:hx-get="@{/nearby-airports?iterIndex={index}&latitude={latitude}&longitude={longitude}&airportFilter=delta(index=${iter.index},latitude=${resultSearch.latitude},longitude=${resultSearch.longitude})}">
    </datalist>
    <input th:id="'airport-code-'+${iter.index}"
           class="form-control"
           type="text" aria-label="Airport"
           name="airport-code"
           th:list="'filtered-list-'+${iter.index}" />
    <button class="btn btn-primary"
            type="submit">Add</button>
</form>

<div th:fragment="add-form-success">
    <p th:text="'Successfully passed airport code: '+${locationForm.airportCode}"></p>
    <p th:text="'Successfully passed latitude, longitude: ('+${locationForm.latitude} + ','+${locationForm.longitude}+')'"></p>
    <p th:text="'Successfully passed name, subdivision: '+${locationForm.name} + ','+${locationForm.subdivision}"></p>
    <p th:text="'Successfully passed bounds: '+${locationForm.bounds}"></p>
</div>
