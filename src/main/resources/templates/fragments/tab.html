<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Tab Content</title>
</head>
<ul th:fragment="tab-list"
    id="tabList"
    class="nav nav-underline">
    <li class="nav-item">
        <button class="nav-link active"
           id="saved-tab-link"
           hx-get="/saved"
           hx-target="#tabContent"
           hx-on::after-request="activateDeactivate('saved-tab-link','add-tab-link')"
           hx-swap="innerHTML">Saved
        </button>
    </li>
    <li class="nav-item">
        <button class="nav-link"
           id="add-tab-link"
           hx-get="/add"
           hx-target="#tabContent"
           hx-on::after-request="activateDeactivate('add-tab-link','saved-tab-link')"
           hx-swap="innerHTML">Add
        </button>
    </li>
</ul>
<div th:fragment="saved-tab">
    <div th:replace="~{fragments/townlist :: locationList}"></div>
</div>
<div th:fragment="add-tab">
    <div th:replace="~{fragments/search :: lookupContainer}"></div>
</div>
</html>
