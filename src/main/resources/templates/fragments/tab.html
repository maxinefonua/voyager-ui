<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Tab Content</title>
</head>
<ul th:fragment="tab1Active"
        id="tabList"
        hx-swap-oob="outerHTML:#tabList"
        class="nav nav-underline">
    <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="#"
           hx-get="/saved"
           hx-target="#tabContent"
           hx-swap="innerHTML">Saved
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" aria-current="page" href="#"
           hx-get="/add"
           hx-target="#tabContent"
           hx-swap="innerHTML">Add
        </a>
    </li>
</ul>
<ul th:fragment="tab2Active"
        id="tabList"
        hx-swap-oob="outerHTML:#tabList"
        class="nav nav-underline">
    <li class="nav-item">
        <a class="nav-link" aria-current="page" href="#"
           hx-get="/saved"
           hx-target="#tabContent"
           hx-swap="innerHTML">Saved
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="#"
           hx-get="/add"
           hx-target="#tabContent"
           hx-swap="innerHTML">Add
        </a>
    </li>
</ul>
<div th:fragment="savedTab">
    <div th:replace="~{fragments/townlist :: townlist}"></div>
</div>
<div th:fragment="addTab">
    <div th:replace="~{fragments/search :: lookupContainer}"></div>
</div>
</html>
