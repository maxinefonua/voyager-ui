<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Tab Content</title>
</head>
<ul th:fragment="tab-list(defaultPage)"
    id="tabList"
    class="nav nav-underline">
    <li class="nav-item">
        <a class="nav-link tab-btn"
           th:classappend="${#strings.equalsIgnoreCase(defaultPage, 'TRIPS')} ? 'active' : ''"
           id="trips-tab-link"
           hx-get="/trips"
           hx-target="#tabContent"
           hx-on::before-request="activate(this)"
           hx-on::after-request="reloadTrips('scrollable-content');dispatchInput();"
           hx-swap="innerHTML">
            Fly To
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link tab-btn"
           th:classappend="${#strings.equalsIgnoreCase(defaultPage, 'SAVED')} ? 'active' : ''"
           id="saved-tab-link"
                hx-get="/saved"
                hx-target="#tabContent"
                hx-on::before-request="activate(this)"
                hx-on::after-request="recenterMap();sliderFunction()"
                hx-swap="innerHTML">
            By Country
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link tab-btn"
           th:classappend="${#strings.equalsIgnoreCase(defaultPage, 'BROWSE')} ? 'active' : ''"
           id="add-tab-link"
                hx-get="/add"
                hx-target="#tabContent"
                hx-on::before-request="activate(this)"
                hx-on::after-request="recenterMap()"
                hx-swap="innerHTML">
            By Location
        </a>
    </li>
    <li class="nav-item ms-3 row align-items-center">
        <button class="btn btn-primary btn-sm"
                id="toggle-map-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseExample"
                aria-expanded="false"
                onclick="toggleMap(this)"
                aria-controls="collapseExample">Hide Map</button>
    </li>
</ul>
<div th:fragment="saved-tab" class="container mt-2">
    <div class="d-grid gap-0 gap-lg-4 d-lg-flex mb-2 justify-content-start">
        <div class="col-auto">
            <form class="form-check form-switch"
                  th:object="${locationFilter}">
                <label class="form-check-label" for="includeArchived">Include Archived</label>
                <input hx-get="/saved-locations"
                       hx-target="#main-saved-page"
                       hx-swap="outerHTML transition:true"
                       hx-trigger="change"
                       hx-include="[name='includeArchived']"
                       class="form-check-input"
                       type="checkbox"
                       role="switch"
                       id="includeArchived"
                       name="includeArchived"
                       th:field="*{includeArchived}"
                       th:checked="${locationFilter.includeArchived}">
            </form>
        </div>
        <div class="col-auto">
            <div class="d-flex gap-2">
                <div class="col-auto">
                    <div class="range-slider">
                        <div class="track"></div>
                        <div class="progress"></div>
                        <input type="range"
                               th:min="${minExchangeRateValue}" th:max="${maxExchangeRateValue}"
                               th:value="${minExchangeRateValue}"
                               th:step="${(maxExchangeRateValue-minExchangeRateValue) * 0.01}"
                               id="minRange">
                        <input type="range"
                               th:min="${minExchangeRateValue}" th:max="${maxExchangeRateValue}"
                               th:value="${maxExchangeRateValue}"
                               th:step="${(maxExchangeRateValue-minExchangeRateValue) * 0.01}"
                               id="maxRange">
                    </div>
                </div>
                <span class="col-auto">Currency Exchange Range</span>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/saved :: main-saved-page}"></div>
</div>
<div th:fragment="add-tab">
    <div th:replace="~{fragments/search :: lookupContainer}"></div>
</div>
<div th:fragment="trips-tab" class="container mt-2">
    <div th:replace="~{fragments/trips :: trips(startOptionList=${startOptionList},startInputText=${startInputText},startInputValue=${startInputValue},endOptionList=${endOptionList},endInputText=${endInputText},endInputValue=${endInputValue})}"></div>
</div>
</html>
