<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Search Fragments</title>
</head>
<div th:fragment="lookupContainer" class="container">
    <div class="input-group">
        <input class="form-control m-2 me-0"
               type="text" placeholder="Lookup Location" aria-label="Search" name="searchText" id="searchText" list="Recent_Search_List" value="">
        <datalist id="Recent_Search_List">
            <option value="San Jose">timestamp</option>
            <option value="Kahuku">timestamp</option>
            <option value="Grenoble">timestamp</option>
            <option value="Helsinki">timestamp</option>
            <option value="Itami">timestamp</option>
            <option value="Lyon">timestamp</option>
        </datalist>
        <button id="searchButton"
                class="btn btn-outline-success m-2 ms-0"
                hx-get="/search"
                hx-include="#searchText"
                hx-target="#resultContainer"
                hx-swap="innerHTML"
                hx-on::before-request="resetMapOnSearch()"
                hx-on::after-request="setMapToFirstSearch()">Search</button>
    </div>
    <div id="geotag" class="m-2 fw-lighter">Lookup powered by
        <a
                th:href="${lookupAttribution.link}"
                th:text="${lookupAttribution.name}"
                th:target="_blank" rel="noopener noreferrer nofollow"></a>
    </div>
    <div id="resultContainer"
         style="max-height:400px" class="overflow-auto m-2"></div>
    <div id="lookupFooter"></div>
</div>
<div th:fragment="search-location-results"
     id="search-location-results"
     class="accordion list-group">
    <div class="accordion item" th:each="resultDetails,iter : ${lookupResults}">
        <button th:if="${iter.first}"
                id="searchResultButtonHeader-0"
                class="accordion-button list-group-item list-group-item-action list-group-item-light"
                type="button"
                aria-controls="collapse-0"
                data-bs-toggle="collapse"
                data-bs-target="#collapse-0"
                th:data-lat="${resultDetails.resultSearch.latitude}"
                th:data-lng="${resultDetails.resultSearch.longitude}"
                th:data-name="${resultDetails.resultSearch.name}"
                th:data-subdivision="${resultDetails.resultSearch.subdivision}"
                th:data-country="${resultDetails.resultSearch.countryName}"
                th:data-bounds="${#strings.arrayJoin(
                    #numbers.arrayFormatDecimal(resultDetails.resultSearch.bounds, 1, 'POINT', 7, 'POINT'),
                    ','
                )}"
                aria-expanded="true"
                th:text="${resultDetails.resultSearch.name} + ', ' + ${resultDetails.resultSearch.subdivision} + ' | ' + ${resultDetails.resultSearch.countryName}"
                th:onclick="updateLookupMap(this)"></button>
        <button th:unless="${iter.first}"
                id="searchResultButtonHeader-"
                class="accordion-button list-group-item list-group-item-action list-group-item-light collapsed"
                type="button"
                aria-controls="collapse-"
                data-bs-toggle="collapse"
                data-bs-target="#collapse-"
                th:data-lat="${resultDetails.resultSearch.latitude}"
                th:data-lng="${resultDetails.resultSearch.longitude}"
                th:data-name="${resultDetails.resultSearch.name}"
                th:data-subdivision="${resultDetails.resultSearch.subdivision}"
                th:data-country="${resultDetails.resultSearch.countryName}"
                th:data-bounds="${#strings.arrayJoin(
                    #numbers.arrayFormatDecimal(resultDetails.resultSearch.bounds, 1, 'POINT', 7, 'POINT'),
                    ','
                )}"
                aria-expanded="false"
                th:text="${resultDetails.resultSearch.name} + ', ' + ${resultDetails.resultSearch.subdivision} + ' | ' + ${resultDetails.resultSearch.countryName}"
                th:onclick="updateLookupMap(this)"
                th:attrappend="data-bs-target=${iter.index},aria-controls=${iter.index},id=${iter.index}"></button>
        <div
                id="collapse-"
                class="accordion-collapse collapse"
                data-bs-parent="#search-location-results"
                th:attrappend="id=${iter.index}"
                th:classappend="${iter.first}? show">
            <div class="accordion-body">
                <p th:text="${resultDetails.resultSearch.name} +' is a '
                + ${resultDetails.resultSearch.type} + ' of '
                + ${resultDetails.resultSearch.subdivision} + ' in '
                + ${resultDetails.resultSearch.countryName} + '.'">
                </p>
                <form th:replace="~{fragments/browse :: airport-form}"></form>
                <form th:replace="~{fragments/form :: add-location-form}"></form>
            </div>
        </div>
    </div>
    <div th:unless="${not #lists.isEmpty(lookupResults)}"
         class="list-group-item list-group-item-secondary" th:text="'No results returned for &quot;' + ${searchText} + '&quot'"></div>
</div>
<div th:fragment="lookupFooterResults"
     id="lookupFooter"
     class="float-end"
     hx-swap-oob="outerHTML:#lookupFooter">
    <span
            th:if="${totalResultsCount} and ${totalResultsCount} > 0"
            th:text="${totalResultsCount} > 10? '10 of ' + ${totalResultsCount}+ ' total results' : ${totalResultsCount} + ' of ' + ${totalResultsCount}+ ' total results'">
    </span>
    <span
            th:if="${totalResultsCount} and ${totalResultsCount} > 0"
            class="btn-group ms-2"
            role="group"
            aria-label="Basic outlined example">
        <button
                type="button"
                class="btn btn-outline-primary disabled">Prev</button>
        <button
                type="button"
                class="btn btn-outline-primary"
                th:classappend="${totalResultsCount<11}?disabled">Next</button>
    </span>
</div>
</html>
