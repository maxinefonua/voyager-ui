<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx-get="http://www.w3.org/1999/xhtml"
      xmlns:hx-on="http://www.w3.org/1999/xhtml">
<div th:fragment="pin-airport-form-initial(location)">
    <datalist id="filtered-list-" th:attrappend="id=${location.id}"></datalist>
    <div th:id="'saved-pinned-aiports-'+${location.id}">
        <div th:each="airportCode : ${location.airports}"
             th:id="'pinned-'+${airportCode}+'-location-'+${location.id}"
             class="d-flex input-group justify-content-center mb-2"
        >
            <button class="col col-lg-8 btn btn-outline-primary text-truncate input-group-text"
                    hx-get="/pinned-airport-display"
                    hx-trigger="load"
                    th:hx-vals="'{&quot;locationId&quot;:'+${location.id}+'}'"
                    name="airportCode"
                    th:value="${airportCode}"
                    hx-swap="outerHTML transition:true"
            >
                <strong th:text="${airportCode}"></strong>
                <i>Placeholder Airport Name</i>
                <span> | Placeholder City, Subdivision of CC</span>
            </button>
            <button class="col-2 col-lg-1 btn-sm btn btn-secondary"
                    hx-get="/unpin-airport-location"
                    th:hx-vals="'{&quot;locationId&quot;:'+${location.id}+'}'"
                    th:hx-target="'#pinned-'+${airportCode}+'-location-'+${location.id}"
                    hx-swap="outerHTML transition:true"
                    hx-on::after-request="console.log('enable/add unpinned airport from datalist')"
                    name="airportCode"
                    th:value="${airportCode}">Unpin
            </button>
        </div>
    </div>
    <div class="input-group mb-4">
        <select th:replace="~{fragments/pinned :: select-airport-filter}"></select>
        <input th:id="'airport-code-'+${location.id}"
               class="form-control"
               type="text" aria-label="Airport"
               th:oninput="'checkAirportInput(this,'+${location.id}+')'"
               name="airportCode"
               th:list="'filtered-list-'+${location.id}" required>
        <button class="col-2 btn btn-sm btn-outline-secondary"
                hx-get="/pin-airport-location"
                th:hx-include="'#airport-code-'+${location.id}"
                th:hx-vals="'{&quot;locationId&quot;:'+${location.id}+'}'"
                th:hx-target="'#saved-pinned-aiports-'+${location.id}"
                hx-swap="beforeend transition:true"
                hx-on::after-request="console.log('disable/remove pinned airport from datalist')"
                th:attrappend="id=${location.id}">Pin</button>
    </div>
</div>

<div th:fragment="pinned-airport"
     th:if="${airport}"
     th:id="'pinned-'+${airport.iata}+'-location-'+${location.id}"
     class="d-flex input-group justify-content-center mb-2"
>
    <button class="col col-lg-8 btn btn-outline-primary text-truncate input-group-text">
        <strong th:text="${airport.iata}"></strong>
        <i th:text="' ' + ${airport.name} + ' '"></i>
        <span th:text="' | ' + ${airport.city} + ', ' + ${airport.subdivision} + ' of ' + ${airport.countryCode}"></span>
    </button>
    <button class="col-2 col-lg-1 btn-sm btn btn-secondary"
            hx-get="/unpin-airport-location"
            th:hx-vals="'{&quot;locationId&quot;:'+${location.id}+'}'"
            th:hx-target="'#pinned-'+${airport.iata}+'-location-'+${location.id}"
            hx-swap="outerHTML transition:true"
            hx-on::after-request="console.log('enable/add unpinned airport from datalist')"
            name="airportCode"
            th:value="${airport.iata}">Unpin
    </button>
</div>

<button th:fragment="pinned-airport-display"
        class="col col-lg-8 btn btn-outline-primary text-truncate input-group-text">
    <strong th:text="${airport.iata}"></strong>
    <i th:text="' ' + ${airport.name} + ' '"></i>
    <span th:text="' | ' + ${airport.city} + ', ' + ${airport.subdivision} + ' of ' + ${airport.countryCode}"></span>
</button>

<select th:fragment="select-airport-filter"
        class="form-select"
        name="airportFilter"
        style="max-width:150px"
        hx-get="/nearby-airports"
        th:hx-vals="'{&quot;latitude&quot;:'+${location.latitude}+',&quot;longitude&quot;:'+${location.longitude}+'}'"
        th:hx-on::after-request="'setAirportPlaceHolderFromList(\'airport-code-' + ${location.id} + '\',\'filtered-list-' + ${location.id} + '\')'"
        th:hx-on::before-request="'clearAirportMarkerFitToElemId(airportMarker,\'location-display-'+${location.id}+'\')'"
        th:hx-target="'#filtered-list-'+${location.id}"
        hx-trigger="load,change"
        hx-swap="innerHTML">
    <option selected value="DELTA">Delta Airports</option>
    <hr class="dropdown-divider">
    <option value="ALL">All</option>
</select>
</html>
