<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">

<!--TRIPS MAIN PAGE-->
<div th:fragment="trips" class="container">
    <div id="scrollable-content"
         data-bs-spy="scroll"
         data-bs-target="#trips-scroll-nav"
         data-bs-smooth-scroll="true"
         class="scrollspy-example overflow-y-scroll"
         style="height:250px;"
         tabindex="0">
        <h4 id="from-city">From</h4>
        <div style="height:250px"
             class="overflow-auto p-2">
            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       id="select-location-filter"
                       hx-get="/from-selection"
                       hx-swap="innerHTML transition:true"
                       hx-target="#select-start"
                       hx-trigger="change"
                       name="tripFilter"
                       hx-on::after-request="resetTripMap(true)"
                       th:attr="checked=${selection == 'LOCATION'}?'checked'"
                       value="LOCATION">
                <label class="form-check-label" for="select-location-filter">By Location</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       id="select-airport-filter"
                       hx-get="/from-selection"
                       hx-swap="innerHTML transition:true"
                       hx-target="#select-start"
                       hx-trigger="change"
                       name="tripFilter"
                       th:attr="checked=${selection == 'AIRPORT'}?'checked'"
                       hx-on::after-request="resetTripMap(true)"
                       value="AIRPORT">
                <label class="form-check-label" for="select-airport-filter">By Airport</label>
            </div>
            <div id="select-start" class="mt-4 d-grid">
                <div th:replace="~{fragments/routes :: start-by-airport(filterList=${filterList},optionList=${optionList})}"></div>
                <div th:replace="~{fragments/routes :: start-by-location(filterList=${filterList},optionList=${optionList},airportOptionList=${airportOptionList})}"></div>
            </div>
        </div>
    </div>
</div>

<!--Start By Airports Input -->
<div th:if="${selection == 'AIRPORT'}" th:fragment="start-by-airport(filterList,optionList)"
    class="input-group row" style="margin-left:.0em;">
    <select class="form-select" style="max-width:170px"
            hx-get="/trip-options"
            hx-trigger="change"
            hx-include="#selection"
            hx-swap="innerHTML transition:true"
            hx-on::after-request="clearStartMarkers()"
            name="optionFilter"
            hx-target="#select-start-options">
        <option th:each="filter,iter : ${filterList}" th:value="${filter.value}" th:text="${filter.display}"></option>
    </select>
    <input type="hidden" id="selection" name="selection" th:value="${selection}">
    <datalist id="select-start-options">
        <option th:each="option,iter : ${optionList}"
                th:value="${option.value}"
                th:text="${option.display}"></option>
    </datalist>
    <input id="select-start-airport-input"
           class="form-control"
           placeholder="Enter Start Airport" list="select-start-options"
           oninput="debouncedAddAirportToMap(this,true)">
</div>

<!--Start By Location Select -->
<!--TODO: fetch data-name of first location option to add it to airport after hx request,
    TODO: use it to populate pinned airports select elem (selected location input) -->
<div th:if="${selection == 'LOCATION'}" th:fragment="start-by-location(filterList,optionList,airportOptionList)">
<!--    Select LOCATION -->
    <div class="input-group row" style="margin-left:.0em;">
        <select class="form-select" style="max-width:170px"
                hx-get="/trip-options"
                hx-trigger="change"
                hx-include="#selection"
                hx-swap="innerHTML transition:true"
                hx-on::after-settle="addSelectedLocationToMap('select-start-options',true)"
                name="optionFilter"
                hx-target="#select-start-options">
            <option th:each="filter,iter : ${filterList}" th:value="${filter.value}" th:text="${filter.display}"></option>
        </select>
        <input type="hidden" id="selection" name="selection" th:value="${selection}">
        <select class="form-control"
                id="select-start-options"
                hx-get="/trips/nearby-airports-location"
                name="locationId"
                hx-include="#airportFilter"
                hx-target="#select-start-location-airport-options"
                hx-trigger="change"
                hx-swap="outerHTML transition:true"
                onchange="addTripLocationToMapNew(this.options[this.selectedIndex].dataset.elementName,true)"
                hx-on::after-swap="locationSelectSwapped(event.detail.target,true)">
            <option disabled selected value="0">Select Start</option>
            <option th:each="option,iter : ${optionList}"
                    th:data-element-name="${option.elementName}"
                    th:value="${option.value}"
                    th:text="${option.display}"></option>
        </select>
    </div>
<!--    SELECT location AIRPORTS -->
    <div class="input-group row mt-4" style="margin-left:.0em;">
        <!--        TODO: change to hx-get with this filter to reload airportOptionList-->
        <select class="form-select" style="max-width:170px"
                id="airportFilter"
                hx-get="/trips/nearby-airports-location"
                hx-trigger="change"
                hx-include="#select-start-options"
                hx-swap="outerHTML transition:true"
                name="airportFilter"
                hx-on::after-request="removeAirportMarkerFitToLocationMarker(airportStartMarker,startMarker)"
                hx-target="#select-start-location-airport-options">
            <option selected value="PINNED">Pinned Airports</option>
            <option value="CIVIL">Nearby Civil</option>
            <option value="DELTA">Nearby Delta</option>
            <option value="MILITARY">Nearby Military</option>
        </select>
        <!--TODO: change to hx-get with this selection to update review section?
        TODO: this would allow for an hx-get on load to update review?-->
        <select class="form-control"
                id="select-airport-code-for-location" required
                onchange="addAirportFromSelect(this,true)">
            <div id="select-start-location-airport-options">
                <option selected disabled>Select Start to Enable</option>
            </div>
        </select>
    </div>
</div>

<!--SELECT airport options for LOCATION-->
<div th:fragment="airport-select-options-for-location"
     id="select-start-location-airport-options">
    <option th:if="${#lists.isEmpty(optionList)}" selected disabled>Select Start to Enable</option>
    <div th:unless="${#lists.isEmpty(optionList)}">
        <option selected disabled>Select Start Airport</option>
        <option th:each="option,iter : ${optionList}"
                th:attr="data-element-name=${option.elementName}?${option.elementName}"
                th:value="${option.value}"
                th:text="${option.display}"></option>
    </div>
</div>

</html>
