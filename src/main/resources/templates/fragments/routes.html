<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<!--TRIPS MAIN PAGE-->
<div th:fragment="trips" class="container">
    <div id="scrollable-content"
         data-bs-spy="scroll"
         data-bs-target="#trips-scroll-nav"
         data-bs-smooth-scroll="true"
         class="scrollspy-example overflow-y-scroll"
         style="height:250px;"
         tabindex="0">
        <h4 id="from-city">From</h4>
        <div style="height:250px"
             class="overflow-auto p-2">
            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       id="select-location-filter"
                       hx-get="/from-selection"
                       hx-swap="innerHTML transition:true"
                       hx-target="#select-start"
                       hx-trigger="change"
                       name="tripFilter"
                       value="LOCATION">
                <label class="form-check-label" for="select-location-filter">By Location</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       id="select-airport-filter"
                       hx-get="/from-selection"
                       hx-swap="innerHTML transition:true"
                       hx-target="#select-start"
                       hx-trigger="change"
                       name="tripFilter"
                       value="AIRPORT">
                <label class="form-check-label" for="select-airport-filter">By Airport</label>
            </div>
            <div id="select-start" class="mt-4 d-grid">
                <div class="input-group row" style="margin-left:.0em;">
                    <select class="form-select" style="max-width:200px" disabled>
                        <option selected disabled>Select Start</option>
                    </select>
                    <input class="form-control" disabled>
                </div>
            </div>
            <div th:replace="~{fragments/form :: airport-form-initial(true)}"></div>
            <div id="non-delta-start"
                 hx-swap-oob="outerHTML:#non-delta-start">
            </div>
        </div>
    </div>
</div>
<!--Select Start Filter and Options-->
<div th:fragment="selected-start-locations(selection,filterList,optionList)"
    class="input-group row" style="margin-left:.0em;">
    <select class="form-select" style="max-width:200px">
        <option th:each="filter,iter : ${filterList}" th:value="${filter.value}" th:text="${filter.display}"></option>
    </select>
    <datalist th:if="${selection == 'AIRPORT'}" id="select-start-options">
        <option th:each="option,iter : ${optionList}" th:value="${option.value}" th:text="${option.display}"></option>
    </datalist>
    <input th:if="${selection == 'AIRPORT'}" class="form-control"
           placeholder="Enter Airport" list="select-start-options">
    <select th:if="${selection == 'LOCATION'}" class="form-control">
        <option th:each="option,iter : ${optionList}" th:value="${option.value}" th:text="${option.display}"></option>
    </select>
</div>
</html>
