<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml"
      xmlns:hx-get="http://www.w3.org/1999/xhtml">
<head>
    <title>Travel Wishlist</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="../css/stylesheet.css"  />
</head>
<body>
        <div th:replace="~{fragments/topnav :: navbar}">
        </div>
        <div class="collapse show" id="collapse-map-div">
            <div id="map" style="height:30vh;width:100%;"></div>
        </div>
        <div class="container" id="tabMenu">
            <ul th:replace="~{fragments/tab :: tab-list(defaultPage=${defaultPage})}"></ul>
        </div>
        <div th:if="${#strings.equalsIgnoreCase(defaultPage, 'TRIPS')}" class="container" id="tabContent">
            <div th:replace="~{fragments/tab :: trips-tab}"></div>
        </div>
        <div th:if="${#strings.equalsIgnoreCase(defaultPage, 'SAVED')}" class="container" id="tabContent">
            <div th:replace="~{fragments/tab :: saved-tab}"></div>
        </div>
        <div th:if="${#strings.equalsIgnoreCase(defaultPage, 'BROWSE')}" class="container" id="tabContent">
            <div th:replace="~{fragments/tab :: add-tab}"></div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="../js/map.js"></script>
    <script src="../js/markers.js"></script>
    <script src="../js/dom.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/input.js"></script>
    <script src="../js/display.js"></script>
    <script src="../js/delay.js"></script>
</body>
</html>
