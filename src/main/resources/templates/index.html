<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml"
      xmlns:hx-get="http://www.w3.org/1999/xhtml">
<head>
    <title>Travel Wishlist</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="../css/stylesheet.css"  />
</head>
<body onload="mapToFirstLocation(false)">
    <div class="page-wrapper" style="display:flex;flex-direction:column;">
        <div th:replace="~{fragments/topnav :: navbar}">
        </div>
        <h1 class="p-4">Oh, the Places to Go!</h1>
        <div id="map" style="min-height:200px;width:100%;"></div>
        <div class="container" id="tabMenu">
            <ul th:replace="~{fragments/tab :: tab-list}"></ul>
        </div>
        <div class="container" id="tabContent">
            <div th:replace="~{fragments/tab :: trips-tab}"></div>
        </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <datalist id="all-airports" hx-get="/airports" hx-vals="{&quot;airportFilter&quot;:&quot;ALL&quot;}" hx-trigger="load"></datalist>
    <datalist id="delta-airports" hx-get="/airports" hx-vals="{&quot;airportFilter&quot;:&quot;DELTA&quot;}" hx-trigger="load"></datalist>
    <datalist id="all-locations" hx-get="/locations" hx-trigger="load"></datalist>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="../js/map.js"></script>
    <script src="../js/markers.js"></script>
    <script src="../js/dom.js"></script>
    <script src="../js/pin.js"></script>
    <script src="../js/delay.js"></script>
</body>
</html>
