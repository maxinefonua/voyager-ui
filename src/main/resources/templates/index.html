<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml"
      xmlns:hx-get="http://www.w3.org/1999/xhtml">
<head>
    <title>Travel Wishlist</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <link th:href="@{/css/stylesheet.css}" rel="stylesheet" />
</head>
<body>
    <div class="page-wrapper" style="display:flex;flex-direction:column;">
        <div th:replace="~{fragments/topnav :: navbar}">
        </div>
        <h1 class="p-4">Oh, the Places to Go!</h1>
        <div id="map" style="min-height:200px;width:100%;"></div>
        <div class="container" id="tabMenu">
            <ul th:replace="~{fragments/tab :: tab2Active}"></ul>
        </div>
        <div class="container" id="tabContent">
            <div th:replace="~{fragments/tab :: addTab}"></div>
        </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
<!--    TODO: implement loading data into the DOM https://docs.mapbox.com/help/tutorials/custom-markers-gl-js/?step=4 -->
    <script>
        var lookupMarker = null;
        var airportMarker = null;
        var map = new mapboxgl.Map({
            container: 'map',
            style: {
                version: 8,
                    sources: {
                        osm: {
                            type: 'raster',
                            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                            tileSize: 256
                        }
                    },
                    layers: [{
                        id: 'osm',
                        type: 'raster',
                        source: 'osm',
                    }],
                },
            attributionControl: false
        }).addControl(new mapboxgl.AttributionControl({
            customAttribution: [
                '&copy; <a href="https://www.mapbox.com/about/maps">Mapbox</a>',
                '&copy; <a href="https://osm.org/copyright" target=”_blank" rel="noopener noreferrer nofollow">OpenStreetMap</a>'],
            compact: false
        }));
        const nav = new mapboxgl.NavigationControl({
          showCompass: false,
          visualizePitch: false
        });
        map.addControl(nav);

        function setAirportPlaceHolder(iterIndex) {
            const airportInput = document.getElementById("airport-code-"+iterIndex);
            const airportList = document.getElementById("filtered-list-"+iterIndex);
            if (airportInput && airportList && airportList.options && airportList.options[0]) {
                airportInput.placeholder = airportList.options[0].value;
            }
        }

        function updateLookupMap(iterIndex,longitude,latitude,bounds) {
          if (airportMarker) airportMarker.remove();
          if (lookupMarker) lookupMarker.remove();
          const clickedButton = document.getElementById("searchResultButtonHeader-"+iterIndex);
          if (clickedButton && clickedButton.getAttribute("aria-expanded") == "true") {
              map.fitBounds(bounds);
              lookupMarker = new mapboxgl.Marker().setLngLat([longitude,latitude]).addTo(map);
          }
        };

        function checkAirportInput(iterIndex) {
          const airportInput = document.getElementById("airport-code-"+iterIndex);
          const airportList = document.getElementById("filtered-list-"+iterIndex);
          const regex = /^[a-zA-Z]{3}$/;
          if (airportInput && airportInput.value && regex.test(airportInput.value)) {
            if (airportList && airportList.options && airportList.options.namedItem(airportInput.value.toUpperCase())) {
              const airportMatch = airportList.options.namedItem(airportInput.value.toUpperCase());
              const invalidFeedback = document.getElementById("airport-invalid-feedback-"+iterIndex);
              if (invalidFeedback) {
                invalidFeedback.remove();
                airportInput.classList.remove('is-invalid');
              }
              updateWithAirportMap(airportMatch.dataset.longitude,airportMatch.dataset.latitude);
            } else {
              console.log('checkAirportInput called with index: ' + iterIndex + ', length: ' + airportInput.value.length + ', no match. Airport value: ' + airportInput.value);
            }
          }
        };

        function updateWithAirportMap(longitude,latitude) {
          if (airportMarker) airportMarker.remove();
          if (lookupMarker) {
            const lngLat = lookupMarker.getLngLat();
            const south = lngLat.lat < latitude? lngLat.lat : latitude;
            const north = lngLat.lat > latitude? lngLat.lat : latitude;
            const west = lngLat.lng < longitude? lngLat.lng : longitude;
            const east = lngLat.lng > longitude? lngLat.lng : longitude;
            const bounds = [west,south,east,north];
            map.fitBounds(bounds, {padding: {top: 60, bottom: 30, left: 40, right: 40}});
            airportMarker = new mapboxgl.Marker({color:"#9B1631"})
                .setLngLat([longitude,latitude])
                .setPopup(
                    new mapboxgl.Popup({ offset: 25 }) // add popups
                      .setHTML(
                        `<h3>Test Title</h3><p>Test Description</p>`
                      )
                  )
                .addTo(map);
          }
        };

        function recenterMap() {
          if (lookupMarker) lookupMarker.remove();
          if (airportMarker) airportMarker.remove();
          map.flyTo({
              center: [0, 0],
              zoom: 0
          });
        }

        function resetMapOnSearch() {
          recenterMap();
          document.getElementById('searchButton').disabled = true;
          document.getElementById('searchButton').innerHTML = 'Searching';
        }

        function setMapToFirstResult() {
          if (lookupMarker) lookupMarker.remove();
          const firstResultButton = document.getElementById("searchResultButtonHeader-0");
          if (firstResultButton) {
            const longitude = firstResultButton.dataset.lng;
            const latitude = firstResultButton.dataset.lat;
            const bounds = [firstResultButton.dataset.boundsWest,firstResultButton.dataset.boundsSouth,firstResultButton.dataset.boundsEast,firstResultButton.dataset.boundsNorth]
            updateLookupMap(0,longitude,latitude,bounds);
          }
          document.getElementById('searchButton').innerHTML = 'Search';
          document.getElementById('searchButton').disabled = false;
        }
    </script>
</body>
</html>
